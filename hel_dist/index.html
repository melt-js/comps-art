<!doctype html>

<html lang="en" class="hel-standalone">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>comps-art</title>

      独立访问本页时由这里的 CDN 提供运行时；
      data-helappend="0"：宿主通过 hel 解析本页时跳过这些脚本，
      使用宿主自己在入口注入的那一份，避免双实例（双 vue / 双 router / 双 i18n）。
    -->
    <script data-helappend="0" src="https://unpkg.com/vue@3.5.45/dist/vue.global.prod.js"></script>

      data-helappend="0"
      src="https://unpkg.com/element-plus@2.14.7/dist/index.full.min.js"

    <script data-helappend="0" src="https://unpkg.com/pinia@3.0.4/dist/pinia.iife.prod.js"></script>
    <script
      data-helappend="0"
      src="https://unpkg.com/vue-i18n@10.0.8/dist/vue-i18n.global.prod.js"
    ></script>
    <link
      data-helappend="0"
      rel="stylesheet"
      href="https://unpkg.com/element-plus@2.14.7/dist/index.css"
    />
    <script type="module" crossorigin src="/comps-art/hel_dist/assets/index-C9iUHKdL.js"></script>
    <link rel="modulepreload" crossorigin href="/comps-art/hel_dist/assets/preload-helper-DJ6kqvi3.js">
    <link rel="modulepreload" crossorigin href="/comps-art/hel_dist/assets/shared-runtime-u88-9G6Q.js">

    <link rel="stylesheet" crossorigin href="/comps-art/hel_dist/assets/style-ChCm0n5J.css">
  </head>

  </body>
</html>
